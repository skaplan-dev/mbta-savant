name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Optional custom domain; leave these repository variables unset to use the *.cloudfront.net address.
      SITE_HOSTNAME: ${{ vars.SITE_HOSTNAME }}
      HOSTED_ZONE: ${{ vars.HOSTED_ZONE }}
      CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
      EXTRA_HOSTNAME: ${{ vars.EXTRA_HOSTNAME }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run deploy shell script
        run: bash deploy.sh
