# Cost estimate: S3 storage for ~1 GB of segments per year (~$0.023/GB-month, well
# under $1/yr); CloudFront at hobby traffic is within the free tier; Route53/ACM add
# nothing; GitHub Actions minutes are free for public repos. Total: well under $1/month.
name: nightly

on:
  schedule:
    - cron: '0 10 * * *' # 05:00/06:00 Boston, after LAMP publishes
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to ingest (YYYY-MM-DD). Defaults to yesterday in America/New_York.'
        required: false

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BUCKET: savant.labs.transitmatters.org

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.13
        working-directory: pipeline
      - name: Resolve date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "INGEST_DATE=${{ inputs.date }}" >> "$GITHUB_ENV"
          else
            echo "INGEST_DATE=$(TZ=America/New_York date -d yesterday +%F)" >> "$GITHUB_ENV"
          fi
      - name: Pull existing segments
        run: aws s3 sync s3://$BUCKET/segments ./work/segments
      - name: Ingest
        run: uv run savant ingest --date "$INGEST_DATE" --root ../work
        working-directory: pipeline
      - name: Build stats
        run: uv run savant build --root ../work --out ../out
        working-directory: pipeline
      - name: Push segments
        run: aws s3 sync ./work/segments s3://$BUCKET/segments
      - name: Publish data
        run: |
          aws s3 sync ./out/data s3://$BUCKET/data --delete \
            --content-type application/json \
            --cache-control "public, max-age=3600"
      - name: Invalidate data cache
        run: |
          CLOUDFRONT_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items!=null] | [?contains(Aliases.Items, '$BUCKET')].Id | [0]" --output text)
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/data/*"
