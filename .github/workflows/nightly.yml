# Cost estimate: S3 storage for ~1 GB of segments per year (~$0.023/GB-month, well
# under $1/yr); CloudFront at hobby traffic is within the free tier; Route53/ACM add
# nothing (only with a custom domain); GitHub Actions minutes are free for public repos. The nightly job caches
# work/segments in GitHub Actions: on a normal night S3 egress is about the new day's files
# plus LIST requests (pennies); a cold cache does a full pull of about 740 MB (roughly
# $0.07). Each night re-ingests a rolling
# 3-day window (D-2..D) to pick up late LAMP data, so LAMP reads are about 3x65 = 195 MB/night
# (about $0.50/month egress). Total: well under $1/month.
name: nightly

on:
  schedule:
    - cron: '0 10 * * *' # 05:00/06:00 Boston, after LAMP publishes
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to ingest (YYYY-MM-DD). Defaults to yesterday in America/New_York.'
        required: false

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    # Public repo => standard runner has 4 vCPU / 16 GB. Build peak memory was ~5 GB on a
    # synthetic half-year bus window; if the repo becomes private, a larger runner may be needed.
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Repository variables, from the deploy stack's S3BucketName and CloudFrontDistributionId outputs.
      BUCKET: ${{ vars.SAVANT_BUCKET }}
      CLOUDFRONT_ID: ${{ vars.SAVANT_DISTRIBUTION_ID }}
      # Canonical hostname for the per-page HTML; unset skips that step.
      SITE_HOSTNAME: ${{ vars.SITE_HOSTNAME }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.13
        working-directory: pipeline
      - name: Resolve date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            if ! [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid date input: expected YYYY-MM-DD" >&2
              exit 1
            fi
            D="$INPUT_DATE"
          else
            D=$(TZ=America/New_York date -d yesterday +%F)
          fi
          echo "INGEST_DATE=$D" >> "$GITHUB_ENV"
          echo "START_DATE=$(date -d "$D - 2 days" +%F)" >> "$GITHUB_ENV"
      # Restore the newest segments cache (restore-keys prefix match) and save a new one
      # under this run's key. The post-step save only runs if the job succeeds, which is fine.
      # The 10 GB repo cache limit is ample (~0.75 GB/yr of segments).
      # Bump v1 -> v2 after a re-backfill or a change to segment logic to force a cold cache.
      - name: Cache segments
        id: segments-cache
        uses: actions/cache@v4
        with:
          path: work/segments
          key: segments-v1-${{ github.run_id }}
          restore-keys: segments-v1-
      # Always runs. Over a restored cache `aws s3 sync` is incremental: it lists ~4k objects
      # and downloads only files missing locally or different in size. This keeps the cache
      # reconciled with S3 after manual backfills; the cache cuts egress, S3 stays the truth.
      - name: Sync segments from S3
        run: aws s3 sync s3://$BUCKET/segments ./work/segments
      - name: Ingest rolling window
        run: uv run --frozen savant backfill --start "$START_DATE" --end "$INGEST_DATE" --force --root ../work
        working-directory: pipeline
      - name: Build stats
        run: uv run --frozen savant build --root ../work --out ../out
        working-directory: pipeline
      - name: Push window's segments
        run: |
          # The three re-ingested days, for every group. S3 stays the durable copy; never --delete.
          shopt -s nullglob
          for d in "$START_DATE" "$(date -d "$INGEST_DATE - 1 day" +%F)" "$INGEST_DATE"; do
            for f in work/segments/*/"${d:0:4}"/"${d}".parquet; do
              aws s3 cp "$f" "s3://$BUCKET/segments/${f#work/segments/}"
            done
          done
      - name: Publish data
        run: |
          test -s out/data/meta.json && jq -e '.windows | length > 0' out/data/meta.json >/dev/null \
            || { echo "out/data/meta.json missing, empty or without windows; refusing to --delete" >&2; exit 1; }
          aws s3 sync ./out/data s3://$BUCKET/data --delete \
            --content-type application/json \
            --cache-control "public, max-age=3600"
      # Per-page HTML (titles, descriptions, link previews), sitemap.xml and robots.txt from tonight's
      # numbers, using the deployed index.html as the template so the pages load the live assets.
      - name: Publish per-page HTML
        if: env.SITE_HOSTNAME != ''
        run: |
          aws s3 cp "s3://$BUCKET/index.html" /tmp/index.html
          (cd pipeline && uv run --frozen savant pages --template /tmp/index.html \
            --data ../out/data --out ../out/pages --host "$SITE_HOSTNAME")
          aws s3 sync ./out/pages "s3://$BUCKET/pages" --delete \
            --cache-control "no-cache, must-revalidate"
      # CloudFront caches the pages under their rewritten /pages/... paths.
      - name: Invalidate data and page cache
        run: |
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_ID" --paths "/data/*" "/pages/*"
